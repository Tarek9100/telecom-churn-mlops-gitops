apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-kserve
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Tarek9100/telecom-churn-mlops-gitops.git
    targetRevision: main
    path: k8s/kserve

  destination:
    server: https://kubernetes.default.svc
    namespace: churn

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
